name: ApexRotation

options:
  createIntermediateGroups: true
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ApexRotation:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: ApexRotation
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: ../public/image
        buildPhase: resources
        includes:
          - "*.webp"
          - "*.png"
    info:
      path: ApexRotation/Info.plist
      properties:
        CFBundleDisplayName: Apex 轮换
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ApexRotation/ApexRotation.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.apexmap.rotation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apexmap.rotation
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ApexRotationWidgets
        embed: true

  ApexRotationWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ApexRotationWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: ../public/image
        buildPhase: resources
        includes:
          - "*.webp"
          - "*.png"
    info:
      path: ApexRotationWidgets/Info.plist
      properties:
        CFBundleDisplayName: 轮换组件
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ApexRotationWidgets/ApexRotationWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.apexmap.rotation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apexmap.rotation.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"

  ApexRotationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ApexRotationTests
    dependencies:
      - target: ApexRotation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ApexRotation.app/ApexRotation"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ApexRotation:
    build:
      targets:
        ApexRotation: all
    test:
      gatherCoverageData: false
      targets:
        - ApexRotationTests

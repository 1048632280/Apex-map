services:
  apex-map-node:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/apex-map-node:latest
    container_name: apex-map-node
    restart: unless-stopped
    environment:
      PORT: "4173"
      APEXRANKED_API_URL: "https://apexranked.com/api/ranked-map"
    ports:
      - "127.0.0.1:4173:4173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4173/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

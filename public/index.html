<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Apex Legends ranked map rotation." />
    <meta name="theme-color" content="#101215" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Apex Rotation" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Apex Ranked Rotation</title>
    <link rel="icon" href="./image/apex-icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" sizes="180x180" href="./image/apex-icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img src="./image/apex-icon-192.png" alt="" />
          </span>
          <div>
            <p class="eyebrow">APEX LEGENDS</p>
            <h1>排位地图轮换</h1>
          </div>
        </div>
      </header>

      <section class="hero-panel card" aria-labelledby="current-title">
        <div id="current-map-art" class="hero-map-art" aria-hidden="true">
          <img id="current-map-image" class="map-art-image" alt="" decoding="async" />
        </div>
        <div class="hero-content">
          <p class="section-kicker">CURRENT MAP</p>
          <h2 id="current-title">--</h2>
          <p id="current-subtitle" class="map-subtitle">--</p>
          <div class="countdown-row">
            <div class="countdown-block">
              <span class="countdown-label">剩余时间</span>
              <strong id="countdown">--:--:--</strong>
            </div>
            <div class="progress-ring" aria-label="当前地图轮换进度">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="progress-ring-track" cx="60" cy="60" r="50"></circle>
                <circle id="progress-ring-value" class="progress-ring-value" cx="60" cy="60" r="50"></circle>
              </svg>
              <span id="progress-percent">--</span>
            </div>
          </div>
        </div>
        <div id="status-pill" class="status-pill" aria-live="polite">
          <span class="status-dot"></span>
          <span id="status-label">OFFLINE</span>
        </div>
      </section>

      <section class="next-panel card" aria-labelledby="next-title">
        <div id="next-map-thumb" class="next-map-thumb" aria-hidden="true">
          <img id="next-map-image" alt="" decoding="async" loading="lazy" />
        </div>
        <div class="next-copy">
          <p class="section-kicker">NEXT MAP</p>
          <h2 id="next-title">--</h2>
          <p id="next-subtitle" class="map-subtitle">--</p>
        </div>
        <div class="next-time">
          <span>切换时间</span>
          <strong id="next-start">--:--</strong>
        </div>
      </section>

      <section class="timeline-section" aria-labelledby="timeline-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">UPCOMING ROTATION</p>
            <h2 id="timeline-title">轮换时间轴</h2>
          </div>
        </div>
        <div id="timeline" class="timeline card"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
